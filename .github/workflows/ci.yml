name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Node.js 24 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact head commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install npm 12.2.0
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund

      - name: Record runtime and tested commit
        run: |
          node --version
          npm --version
          git rev-parse HEAD

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run all tests
        run: npm test

      - name: Check contracts
        run: npm run check:contracts
